<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WC 2026 · AI Tahmin Bülteni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A0E1A;
      --surface:   #131929;
      --card:      #1A2235;
      --card-hover:#1F2B42;
      --gold:      #C9A84C;
      --gold-dim:  #8B6E2A;
      --blue:      #4A90D9;
      --text:      #E8EDF5;
      --muted:     #6B7A99;
      --win-green: #2ECC71;
      --loss-red:  #E74C3C;
      --draw-gray: #95A5B5;
      --radius:    12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      background: linear-gradient(160deg, #0D1525 0%, #0A0E1A 100%);
      border-bottom: 1px solid rgba(201,168,76,0.2);
      padding: 28px 24px 22px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }

    .trophy {
      font-size: 32px;
      filter: drop-shadow(0 0 12px rgba(201,168,76,0.6));
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(201,168,76,0.4)); }
      50%       { filter: drop-shadow(0 0 20px rgba(201,168,76,0.9)); }
    }

    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      color: var(--text);
      line-height: 1;
    }

    .header-title span { color: var(--gold); }

    .header-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .updated-badge {
      font-size: 11px;
      color: var(--muted);
      background: rgba(255,255,255,0.05);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.07);
      white-space: nowrap;
    }

    /* ── Summary bar ─────────────────────────────────────── */
    .summary-bar {
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 14px 24px;
    }

    .summary-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .stat-pill strong {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--text);
    }

    .stat-pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Main layout ─────────────────────────────────────── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    /* ── Day group ───────────────────────────────────────── */
    .day-group { margin-bottom: 40px; }

    .day-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(201,168,76,0.15);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .day-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(201,168,76,0.15), transparent);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    /* ── Match card ──────────────────────────────────────── */
    .match-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 20px;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .match-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .match-card:hover {
      background: var(--card-hover);
      border-color: rgba(201,168,76,0.2);
      transform: translateY(-2px);
    }

    .match-card:hover::before { opacity: 1; }

    /* joker badge */
    .joker-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #1a1a1a;
      background: var(--gold);
      border-radius: 999px;
      padding: 4px 10px;
    }

    /* stage badge */
    .stage-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* teams row */
    .teams-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .team-block { display: flex; flex-direction: column; gap: 4px; }
    .team-block.away { text-align: right; align-items: flex-end; }

    .team-flag-img { width: 48px; height: 30px; border-radius: 4px; object-fit: cover; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

    .team-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .team-elo {
      font-size: 10px;
      color: var(--muted);
    }

    /* score bubble */
    .score-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .score-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 20px rgba(201,168,76,0.3);
    }

    .score-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .top-scores {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
      width: 100%;
      align-items: center;
    }

    .top-scores.small {
      margin-top: 8px;
      opacity: 0.7;
    }

    .top-scores.small .top-score-val {
      font-size: 11px;
      min-width: 28px;
    }

    .top-scores.small .top-score-val.first {
      font-size: 13px;
    }

    .top-scores.small .top-score-pct,
    .top-scores.small .top-score-pct.first {
      font-size: 9px;
    }

    .small-top-scores-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: 6px;
    }

    .top-score-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .top-score-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 1px;
      color: var(--text);
      line-height: 1;
      min-width: 32px;
      text-align: center;
    }

    .top-score-val.first {
      color: var(--gold);
      font-size: 22px;
    }

    .top-score-pct {
      font-size: 10px;
      color: var(--muted);
      min-width: 36px;
    }

    .top-score-pct.first {
      font-size: 11px;
      color: var(--gold);
      opacity: 0.8;
    }

    /* probability bars */
    .prob-section { margin-top: 4px; }

    .prob-bar-wrap {
      display: flex;
      height: 5px;
      border-radius: 3px;
      overflow: hidden;
      gap: 2px;
      margin-bottom: 8px;
    }

    .prob-seg {
      height: 100%;
      border-radius: 3px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .prob-seg.home  { background: var(--win-green); }
    .prob-seg.draw  { background: var(--draw-gray); }
    .prob-seg.away  { background: var(--loss-red); }

    .prob-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
    }

    .prob-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .prob-item.home-item { align-items: flex-start; }
    .prob-item.away-item { align-items: flex-end; }

    .prob-pct {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .prob-pct.home-pct  { color: var(--win-green); }
    .prob-pct.draw-pct  { color: var(--draw-gray); }
    .prob-pct.away-pct  { color: var(--loss-red); }

    .prob-tag {
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* winner ribbon */
    .winner-ribbon {
      margin-top: 12px;
      padding: 6px 10px;
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 6px;
      font-size: 11px;
      color: var(--gold);
      text-align: center;
      letter-spacing: 0.5px;
    }


    /* ── Accuracy banner ─────────────────────────────────── */
    .accuracy-bar {
      background: linear-gradient(90deg, rgba(46,204,113,0.08) 0%, rgba(10,14,26,0) 100%);
      border-bottom: 1px solid rgba(46,204,113,0.15);
      padding: 12px 24px;
      display: none;
    }

    .accuracy-bar.loaded { display: block; }

    .accuracy-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .accuracy-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: 4px;
    }

    .accuracy-pct {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--win-green);
      letter-spacing: 1px;
      line-height: 1;
    }

    .accuracy-detail {
      font-size: 11px;
      color: var(--muted);
      padding: 3px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .accuracy-divider {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.1);
      margin: 0 4px;
    }


    /* ── Backtest panel ──────────────────────────────────── */
    .backtest-bar {
      background: rgba(74,144,217,0.05);
      border-bottom: 1px solid rgba(74,144,217,0.12);
      padding: 12px 24px;
      display: none;
    }

    .backtest-bar.loaded { display: block; }

    .backtest-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .backtest-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: 4px;
      white-space: nowrap;
    }

    .backtest-detail {
      font-size: 11px;
      color: var(--muted);
      padding: 3px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.07);
      white-space: nowrap;
    }

    .backtest-detail strong {
      color: var(--blue);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* ── Loading / Error states ──────────────────────────── */
    .state-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 16px;
      color: var(--muted);
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(201,168,76,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state-screen p { font-size: 13px; }

    /* ── Filter bar ──────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { border-color: var(--gold-dim); color: var(--text); }

    .filter-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #0A0E1A;
      font-weight: 600;
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 600px) {
      .cards-grid { grid-template-columns: 1fr; }
      .header-title { font-size: 20px; }
      .score-display { font-size: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .match-card, .prob-seg, .trophy { transition: none; animation: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-left">
        <span class="trophy">🏆</span>
        <div>
          <div class="header-title">WC 2026 · <span>AI Tahminleri</span></div>
          <div class="header-sub">XGBoost + ELO + Poisson · Günlük Güncelleme</div>
        </div>
      </div>
      <div class="updated-badge" id="updatedAt">Yükleniyor...</div>
    </div>
  </header>

  <div class="accuracy-bar" id="accuracyBar">
    <div class="accuracy-inner">
      <span class="accuracy-label">🤖 Yapay Zeka Başarı Oranı</span>
      <span class="accuracy-pct" id="accPct">—</span>
      <div class="accuracy-divider"></div>
      <span class="accuracy-detail" id="accCorrect">— / — doğru tahmin</span>
      <span class="accuracy-detail" id="accExact">— 1. skor</span>
      <span class="accuracy-detail" id="accTop3">— top 3</span>
    </div>
  </div>

  <div class="backtest-bar" id="backtestBar">
    <div class="backtest-inner">
      <span class="backtest-label">📊 Backtest</span>
      <span class="backtest-detail">Doğruluk: <strong id="btAcc">—</strong></span>
      <span class="backtest-detail">1. Skor: <strong id="btExact">—</strong></span>
      <span class="backtest-detail">Top 3: <strong id="btTop3">—</strong></span>
      <span class="backtest-detail">Log Loss: <strong id="btLL">—</strong></span>
      <span class="backtest-detail">Brier: <strong id="btBrier">—</strong></span>
      <span class="backtest-detail">Baseline: <strong id="btBaseline">—</strong></span>
      <span class="backtest-detail" id="btMatchCount" style="margin-left:auto;color:var(--muted)"></span>
      <span class="backtest-detail" id="btTrainCount" style="color:var(--muted)"></span>
    </div>
  </div>

  <div class="summary-bar">
    <div class="summary-inner" id="summaryBar">
      <div class="stat-pill"><span class="dot" style="background:var(--gold)"></span><strong id="statTotal">—</strong> Maç</div>
      <div class="stat-pill"><span class="dot" style="background:var(--win-green)"></span><strong id="statPlayed">—</strong> Oynanmış</div>
      <div class="stat-pill"><span class="dot" style="background:var(--blue)"></span><strong id="statRemaining">—</strong> Kalan Tahmin</div>
    </div>
  </div>

  <main>
    <div class="filter-bar" id="filterBar"></div>
    <div id="content"><div class="state-screen"><div class="spinner"></div><p>Tahminler yükleniyor…</p></div></div>
  </main>

  <script>
    // ── Flag CDN helper (flagcdn.com) ─────────────────────
    function getCountryCode(teamName) {
      if (!teamName) return 'un';
      const name = teamName.toLowerCase().trim();
      const countries = {
        'austria': 'at', 'belgium': 'be',
        'bosnia and herzegovina': 'ba', 'bosnia-herzegovina': 'ba',
        'croatia': 'hr', 'czech republic': 'cz', 'czechia': 'cz',
        'england': 'gb-eng', 'france': 'fr', 'germany': 'de',
        'netherlands': 'nl', 'norway': 'no', 'portugal': 'pt',
        'scotland': 'gb-sct', 'spain': 'es', 'sweden': 'se',
        'switzerland': 'ch', 'turkey': 'tr',
        'argentina': 'ar', 'brazil': 'br', 'colombia': 'co',
        'ecuador': 'ec', 'paraguay': 'py', 'uruguay': 'uy',
        'canada': 'ca', 'curacao': 'cw', 'cura\u00e7ao': 'cw',
        'haiti': 'ht', 'mexico': 'mx', 'panama': 'pa',
        'united states': 'us', 'usa': 'us',
        'algeria': 'dz', 'cape verde': 'cv', 'cape verde islands': 'cv',
        'dr congo': 'cd', 'congo dr': 'cd',
        'egypt': 'eg', 'ghana': 'gh', 'ivory coast': 'ci',
        'morocco': 'ma', 'senegal': 'sn', 'south africa': 'za',
        'tunisia': 'tn',
        'australia': 'au', 'iran': 'ir', 'iraq': 'iq',
        'japan': 'jp', 'jordan': 'jo', 'qatar': 'qa',
        'saudi arabia': 'sa', 'south korea': 'kr',
        'uzbekistan': 'uz', 'new zealand': 'nz',
      };
      return countries[name] || 'un';
    }

    function flagImg(team) {
      const code = getCountryCode(team);
      return `<img src="https://flagcdn.com/w80/${code}.png" alt="${team}" class="team-flag-img" />`;
    }

    // ── Stage label map ────────────────────────────────────
    const STAGE_MAP = {
      "GROUP_STAGE":   "Grup Aşaması",
      "ROUND_OF_32":   "Son 32",
      "ROUND_OF_16":   "Son 16",
      "QUARTER_FINALS":"Çeyrek Final",
      "SEMI_FINALS":   "Yarı Final",
      "THIRD_PLACE":   "3. lük Maçı",
      "FINAL":         "Final",
    };

    function stageLabel(s) {
      return STAGE_MAP[s] || s || "Maç";
    }

    // ── "Ev Sahibi"/"Deplasman"/"Beraberlik" -> takım adı ───
    function winnerLabel(result, match) {
      return result === 'Ev Sahibi' ? match.home_team
           : result === 'Deplasman' ? match.away_team
           : 'Beraberlik';
    }

    // ── CSV parser ─────────────────────────────────────────
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      return lines.slice(1).map(line => {
        const vals = line.split(',');
        const obj = {};
        headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim(); });
        return obj;
      });
    }

    // ── Format date ────────────────────────────────────────
    function formatDate(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      // dateStr salt bir takvim günü ("YYYY-MM-DD") temsil eder; izleyicinin
      // tarayıcı saat dilimi UTC'nin gerisindeyse gün kaymasın diye UTC'de biçimlendirilir.
      return d.toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', timeZone: 'UTC' });
    }

    // ── Maçın TR (Europe/Istanbul) takvim gününü döndürür ───
    // kickoff_utc varsa (örn. "2026-06-11T22:00:00Z") TR saatine
    // çevirip o günü döndürür; yoksa "date" alanına düşer.
    function matchDateTR(match) {
      if (match.kickoff_utc) {
        const d = new Date(match.kickoff_utc);
        if (!isNaN(d)) {
          // sv-SE -> "YYYY-MM-DD" formatı verir
          return d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Istanbul' });
        }
      }
      return match.date?.slice(0, 10) || 'Bilinmiyor';
    }

    // ── "YYYY-MM-DD HH:MM UTC" -> Türkiye saati ─────────────
    function formatUpdatedAtTR(utcStr) {
      const iso = utcStr.replace(' UTC', '').replace(' ', 'T') + 'Z';
      const d = new Date(iso);
      if (isNaN(d)) return utcStr;
      const formatted = d.toLocaleString('tr-TR', {
        day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
        timeZone: 'Europe/Istanbul'
      });
      return `${formatted} (TR)`;
    }

    // ── Render card ────────────────────────────────────────
    function renderCard(match) {
      const ph = parseFloat(match.prob_home) || 0;
      const pd = parseFloat(match.prob_draw) || 0;
      const pa = parseFloat(match.prob_away) || 0;
      const total = ph + pd + pa || 100;

      const predicted = match.predicted || '';
      const eloH = match.elo_home ? Math.round(match.elo_home) : '—';
      const eloA = match.elo_away ? Math.round(match.elo_away) : '—';

      // En olası 3 skor: tercihen predict.py'nin Dixon-Coles düzeltmeli
      // matristen ürettiği top1/2/3_score + top1/2/3_prob kolonları kullanılır
      // (dashboard'daki sıralamanın CSV'deki most_likely_score ile tutarlı
      // olması için). Bu kolonlar yoksa (eski arşiv satırları) basit Poisson
      // ile client-side hesaplanır.
      let top3;
      if (match.top1_score) {
        top3 = [1, 2, 3]
          .filter(rank => match[`top${rank}_score`])
          .map(rank => ({ s: match[`top${rank}_score`], p: parseFloat(match[`top${rank}_prob`]) / 100 }));
      } else {
        function poissonPmf(k, lam) {
          let p = Math.exp(-lam);
          for (let i = 1; i <= k; i++) p *= lam / i;
          return p;
        }
        const lh = parseFloat(match.expected_home) || 1.2;
        const la = parseFloat(match.expected_away) || 1.0;
        const maxG = 9;
        const scores = [];
        for (let i = 0; i < maxG; i++) {
          for (let j = 0; j < maxG; j++) {
            scores.push({ s: i + '-' + j, p: poissonPmf(i, lh) * poissonPmf(j, la) });
          }
        }
        scores.sort((a, b) => b.p - a.p);
        top3 = scores.slice(0, 3);
      }
      const topScoresHtml = top3.map((s, idx) => `
        <div class="top-score-item">
          <span class="top-score-val${idx === 0 ? ' first' : ''}">${s.s}</span>
          <span class="top-score-pct${idx === 0 ? ' first' : ''}">%${(s.p * 100).toFixed(1)}</span>
        </div>`).join('');

      const jokerBadge = match.is_joker === 'True' ? '<div class="joker-badge">🃏 Joker</div>' : '';

      let scoreBubbleHtml;
      let winnerText;
      if (match.played) {
        const hg = Math.round(Number(match.home_score));
        const ag = Math.round(Number(match.away_score));
        const actual = hg > ag ? 'Ev Sahibi' : hg < ag ? 'Deplasman' : 'Beraberlik';
        const hasPrediction = !!predicted;
        const correct = hasPrediction && predicted === actual;

        scoreBubbleHtml = `
            <div class="score-bubble">
              <span class="score-label">Maç Sonucu</span>
              <div class="score-display">${hg}-${ag}</div>
              ${hasPrediction ? `
              <div class="small-top-scores-label">Model Tahmini</div>
              <div class="top-scores small">${topScoresHtml}</div>` : ''}
            </div>`;

        winnerText = !hasPrediction
          ? (actual === 'Beraberlik' ? '⚪ Berabere bitti' : `⚪ ${winnerLabel(actual, match)} kazandı`)
          : correct
          ? `✅ Tahmin doğruydu (${winnerLabel(predicted, match)})`
          : `❌ Yanlış tahmin — beklenen: ${winnerLabel(predicted, match)}, gerçek: ${winnerLabel(actual, match)}`;
      } else {
        scoreBubbleHtml = `
            <div class="score-bubble">
              <span class="score-label">En Olası Skorlar</span>
              <div class="top-scores">${topScoresHtml}</div>
            </div>`;

        winnerText = `🏅 ${winnerLabel(predicted, match)} bekleniyor`;
        if (predicted === 'Beraberlik') winnerText = '🤝 Beraberlik bekleniyor';
      }

      return `
        <div class="match-card">
          ${jokerBadge}
          <div class="stage-badge">${stageLabel(match.stage)}</div>
          <div class="teams-row">
            <div class="team-block home">
              ${flagImg(match.home_team)}
              <span class="team-name">${match.home_team}</span>
              <span class="team-elo">ELO ${eloH}</span>
            </div>
${scoreBubbleHtml}
            <div class="team-block away">
              ${flagImg(match.away_team)}
              <span class="team-name">${match.away_team}</span>
              <span class="team-elo">ELO ${eloA}</span>
            </div>
          </div>
          <div class="prob-section">
            <div class="prob-bar-wrap">
              <div class="prob-seg home" style="width:${ph/total*100}%"></div>
              <div class="prob-seg draw" style="width:${pd/total*100}%"></div>
              <div class="prob-seg away" style="width:${pa/total*100}%"></div>
            </div>
            <div class="prob-labels">
              <div class="prob-item home-item">
                <span class="prob-pct home-pct">%${ph.toFixed(0)}</span>
                <span class="prob-tag">Ev</span>
              </div>
              <div class="prob-item">
                <span class="prob-pct draw-pct">%${pd.toFixed(0)}</span>
                <span class="prob-tag">Beraberlik</span>
              </div>
              <div class="prob-item away-item">
                <span class="prob-pct away-pct">%${pa.toFixed(0)}</span>
                <span class="prob-tag">Deplasman</span>
              </div>
            </div>
          </div>
          <div class="winner-ribbon">${winnerText}</div>
        </div>`;
    }

    // ── Group by date ──────────────────────────────────────
    function groupByDate(matches) {
      const groups = {};
      matches.forEach(m => {
        const d = matchDateTR(m);
        if (!groups[d]) groups[d] = [];
        groups[d].push(m);
      });
      return groups;
    }

    // ── Render all ─────────────────────────────────────────
    function renderAll(matches, activeStage) {
      const filtered = activeStage === 'ALL'
        ? matches
        : matches.filter(m => (m.stage || '') === activeStage);

      if (filtered.length === 0) {
        document.getElementById('content').innerHTML =
          `<div class="state-screen"><p>Bu aşamada tahmin bulunamadı.</p></div>`;
        return;
      }

      const groups = groupByDate(filtered);
      let html = '';
      Object.keys(groups).sort().forEach(date => {
        html += `<div class="day-group">
          <div class="day-label">${formatDate(date)}</div>
          <div class="cards-grid">
            ${groups[date].map(renderCard).join('')}
          </div>
        </div>`;
      });
      document.getElementById('content').innerHTML = html;
    }

    // ── Build filter buttons ───────────────────────────────
    function buildFilters(matches, activeStage, onSelect) {
      const stages = ['ALL', ...new Set(matches.map(m => m.stage || '').filter(Boolean))];
      const bar = document.getElementById('filterBar');
      bar.innerHTML = stages.map(s => `
        <button class="filter-btn ${s === activeStage ? 'active' : ''}" data-stage="${s}">
          ${s === 'ALL' ? 'Tümü' : stageLabel(s)}
        </button>`).join('');
      bar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => onSelect(btn.dataset.stage));
      });
    }

    // ── Main load ──────────────────────────────────────────
    async function load() {
      try {
        const res = await fetch('data/predictions.csv?t=' + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const upcoming = parseCSV(text).filter(m => m.home_team && m.away_team);

        // Oynanmış maçlar: matches_2026.csv'den gerçek skor + predictions_history.csv'den
        // o maç için yapılmış son tahmin birleştirilir, böylece kart kaybolmadan
        // gerçek sonuç + modelin tahminini gösterebilir.
        let finished = [];
        try {
          const [matchesRes, histRes] = await Promise.all([
            fetch('data/matches_2026.csv?t=' + Date.now()),
            fetch('data/predictions_history.csv?t=' + Date.now()),
          ]);
          if (matchesRes.ok && histRes.ok) {
            const allMatches = parseCSV(await matchesRes.text());
            const history = parseCSV(await histRes.text());
            const histMap = {};
            history.forEach(h => {
              histMap[`${h.date}|${h.home_team}|${h.away_team}`] = h;
            });
            finished = allMatches
              .filter(m => m.status === 'FINISHED' && m.home_team && m.away_team)
              .map(m => {
                const hist = histMap[`${m.date}|${m.home_team}|${m.away_team}`] || {};
                return { ...hist, ...m, played: true };
              });
          }
        } catch(e) { /* maç sonucu/tahmin geçmişi henüz yok */ }

        const matches = [...finished, ...upcoming];

        // Accuracy banner
        try {
          const accRes = await fetch('data/accuracy.json?t=' + Date.now());
          if (accRes.ok) {
            const acc = await accRes.json();
            if (acc.total > 0) {
              document.getElementById('accPct').textContent = '%' + acc.accuracy;
              document.getElementById('accCorrect').textContent = acc.correct + ' / ' + acc.total + ' doğru tahmin';
              document.getElementById('accExact').textContent = acc.exact + ' tam skor (%' + acc.exact_pct + ')';
              document.getElementById('accTop3').textContent = acc.top3 + ' top 3 (%' + acc.top3_pct + ')';
              document.getElementById('accuracyBar').classList.add('loaded');
            }
          }
        } catch(e) { /* accuracy.json henüz yok, banner gizli kalır */ }
        // Backtest banner
        try {
          const btRes = await fetch('data/backtest.json?t=' + Date.now());
          if (btRes.ok) {
            const bt = await btRes.json();
            document.getElementById('btAcc').textContent      = '%' + bt.accuracy;
            document.getElementById('btExact').textContent    = '%' + bt.exact_acc;
            document.getElementById('btTop3').textContent     = bt.top3_acc !== undefined ? '%' + bt.top3_acc : '—';
            document.getElementById('btLL').textContent       = bt.log_loss;
            document.getElementById('btBrier').textContent    = bt.brier;
            document.getElementById('btBaseline').textContent = '%' + bt.baseline;
            document.getElementById('backtestBar').classList.add('loaded');
            document.getElementById('btMatchCount').textContent = 'Test: ' + bt.test_matches + ' maç';
            document.getElementById('btTrainCount').textContent   = 'Train: ' + bt.train_matches + ' maç';
          }
        } catch(e) { /* backtest.json henüz yok */ }



        // Summary bar
        document.getElementById('statTotal').textContent = matches.length;
        document.getElementById('statPlayed').textContent = finished.length;
        document.getElementById('statRemaining').textContent = upcoming.length;

        // Updated at (UTC -> TR saatine çevrilir)
        const updatedAt = upcoming[0]?.updated_at || '';
        document.getElementById('updatedAt').textContent = updatedAt
          ? `Son güncelleme: ${formatUpdatedAtTR(updatedAt)}`
          : 'Tahminler yüklendi';

        // Filters + render
        let activeStage = 'ALL';
        function update(stage) {
          activeStage = stage;
          buildFilters(matches, activeStage, update);
          renderAll(matches, activeStage);
        }
        update('ALL');

      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="state-screen">
            <p>⚠️ Tahminler yüklenemedi.</p>
            <p style="font-size:11px;margin-top:4px">
              <code>data/predictions.csv</code> dosyasının mevcut olduğundan emin olun.
            </p>
          </div>`;
        console.error(err);
      }
    }

    load();
  </script>
</body>
</html>
