<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WC 2026 · AI Tahmin Bülteni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://flagcdn.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A0E1A;
      --surface:   #131929;
      --card:      #1A2235;
      --card-hover:#1F2B42;
      --gold:      #C9A84C;
      --gold-dim:  #8B6E2A;
      --blue:      #4A90D9;
      --text:      #E8EDF5;
      --muted:     #6B7A99;
      --win-green: #2ECC71;
      --loss-red:  #E74C3C;
      --draw-gray: #95A5B5;
      --radius:    12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      background: linear-gradient(160deg, #0D1525 0%, #0A0E1A 100%);
      border-bottom: 1px solid rgba(201,168,76,0.2);
      padding: 28px 24px 22px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }

    .trophy {
      font-size: 32px;
      filter: drop-shadow(0 0 12px rgba(201,168,76,0.6));
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(201,168,76,0.4)); }
      50%       { filter: drop-shadow(0 0 20px rgba(201,168,76,0.9)); }
    }

    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      color: var(--text);
      line-height: 1;
    }

    .header-title span { color: var(--gold); }

    .header-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .updated-badge {
      font-size: 11px;
      color: var(--muted);
      background: rgba(255,255,255,0.05);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.07);
      white-space: nowrap;
    }

    /* ── Summary bar ─────────────────────────────────────── */
    .summary-bar {
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 14px 24px;
    }

    .summary-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .stat-pill strong {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--text);
    }

    .stat-pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Main layout ─────────────────────────────────────── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    /* ── Calendar ────────────────────────────────────────── */
    .cal-day-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 10px;
    }

    .cal-nav-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      width: 36px; height: 36px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .cal-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.13); }
    .cal-nav-btn:disabled { opacity: 0.25; cursor: default; }

    .cal-day-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--text);
      text-align: center;
      flex: 1;
      cursor: pointer;
      user-select: none;
    }
    .cal-day-label:hover { color: var(--gold); }
    .cal-chevron { font-size: 12px; margin-left: 6px; opacity: 0.7; }

    .cal-grid-wrap {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      max-width: 380px;
    }
    .cal-grid-wrap.cal-collapsed { display: none; }

    .cal-month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .cal-month-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--text);
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 6px;
    }

    .cal-wd {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      padding: 4px 0;
    }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid transparent;
    }

    .cal-day.no-match { opacity: 0.2; }

    .cal-day.has-match {
      background: rgba(46,125,50,0.22);
      border-color: rgba(76,175,80,0.35);
      color: #66bb6a;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cal-day.has-match:hover { background: rgba(46,125,50,0.42); }

    .cal-day.has-match.past {
      background: rgba(46,125,50,0.12);
      border-color: rgba(76,175,80,0.18);
      color: #4caf50;
    }

    .cal-day.today {
      outline: 1.5px solid var(--gold);
      outline-offset: -1.5px;
    }

    .cal-day.selected {
      background: #c0392b !important;
      border-color: #e74c3c !important;
      color: #fff !important;
    }

    /* ── Cards ───────────────────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    /* ── Match card ──────────────────────────────────────── */
    .match-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 20px;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .match-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .match-card:hover {
      background: var(--card-hover);
      border-color: rgba(201,168,76,0.2);
      transform: translateY(-2px);
    }

    .match-card:hover::before { opacity: 1; }

    /* joker badge */
    .joker-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #1a1a1a;
      background: var(--gold);
      border-radius: 999px;
      padding: 4px 10px;
    }

    /* stage badge */
    .stage-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* teams row */
    .teams-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .team-block { display: flex; flex-direction: column; gap: 4px; }
    .team-block.away { text-align: right; align-items: flex-end; }

    .team-flag-img { width: 48px; height: 30px; border-radius: 4px; object-fit: cover; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

    .team-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .team-elo {
      font-size: 10px;
      color: var(--muted);
    }

    /* score bubble */
    .score-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .score-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 20px rgba(201,168,76,0.3);
    }

    .score-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .top-scores {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
      width: 100%;
      align-items: center;
    }

    .top-scores.small {
      margin-top: 8px;
      opacity: 0.7;
    }

    .top-scores.small .top-score-val {
      font-size: 11px;
      min-width: 28px;
    }

    .top-scores.small .top-score-val.first {
      font-size: 13px;
    }

    .top-scores.small .top-score-pct,
    .top-scores.small .top-score-pct.first {
      font-size: 9px;
    }

    .small-top-scores-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: 6px;
    }

    .top-score-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .top-score-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 1px;
      color: var(--text);
      line-height: 1;
      min-width: 32px;
      text-align: center;
    }

    .top-score-val.first {
      color: var(--gold);
      font-size: 22px;
    }

    .top-score-pct {
      font-size: 10px;
      color: var(--muted);
      min-width: 36px;
    }

    .top-score-pct.first {
      font-size: 11px;
      color: var(--gold);
      opacity: 0.8;
    }

    /* probability bars */
    .prob-section { margin-top: 4px; }

    .prob-bar-wrap {
      display: flex;
      height: 5px;
      border-radius: 3px;
      overflow: hidden;
      gap: 2px;
      margin-bottom: 8px;
    }

    .prob-seg {
      height: 100%;
      border-radius: 3px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .prob-seg.home  { background: var(--win-green); }
    .prob-seg.draw  { background: var(--draw-gray); }
    .prob-seg.away  { background: var(--loss-red); }

    .prob-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
    }

    .prob-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .prob-item.home-item { align-items: flex-start; }
    .prob-item.away-item { align-items: flex-end; }

    .prob-pct {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .prob-pct.home-pct  { color: var(--win-green); }
    .prob-pct.draw-pct  { color: var(--draw-gray); }
    .prob-pct.away-pct  { color: var(--loss-red); }

    .prob-tag {
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* winner ribbon */
    .winner-ribbon {
      margin-top: 12px;
      padding: 6px 10px;
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 6px;
      font-size: 11px;
      color: var(--gold);
      text-align: center;
      letter-spacing: 0.5px;
    }


    /* ── Accuracy banner ─────────────────────────────────── */
    .accuracy-bar {
      background: linear-gradient(90deg, rgba(46,204,113,0.08) 0%, rgba(10,14,26,0) 100%);
      border-bottom: 1px solid rgba(46,204,113,0.15);
      padding: 12px 24px;
      display: none;
    }

    .accuracy-bar.loaded { display: block; }

    .accuracy-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .accuracy-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: 4px;
    }

    .accuracy-pct {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--win-green);
      letter-spacing: 1px;
      line-height: 1;
    }

    .accuracy-detail {
      font-size: 11px;
      color: var(--muted);
      padding: 3px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .accuracy-detail strong { color: var(--gold); }

    .acc-count {
      color: var(--muted);
      font-size: 0.9em;
      margin-left: 1px;
    }

    .accuracy-divider {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.1);
      margin: 0 4px;
    }


    /* ── Backtest panel ──────────────────────────────────── */
    .backtest-bar {
      background: rgba(74,144,217,0.05);
      border-bottom: 1px solid rgba(74,144,217,0.12);
      padding: 12px 24px;
      display: none;
    }

    .backtest-bar.loaded { display: block; }

    .backtest-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .backtest-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: 4px;
      white-space: nowrap;
    }

    .backtest-detail {
      font-size: 11px;
      color: var(--muted);
      padding: 3px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.07);
      white-space: nowrap;
    }

    .backtest-detail strong {
      color: var(--blue);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* ── Loading / Error states ──────────────────────────── */
    .state-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 16px;
      color: var(--muted);
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(201,168,76,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state-screen p { font-size: 13px; }


    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 600px) {
      .cards-grid { grid-template-columns: 1fr; }
      .header-title { font-size: 20px; }
      .score-display { font-size: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .match-card, .prob-seg, .trophy { transition: none; animation: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-left">
        <span class="trophy">🏆</span>
        <div>
          <div class="header-title">WC 2026 · <span>AI Tahminleri</span></div>
          <div class="header-sub">XGBoost + ELO + Poisson · Günlük Güncelleme</div>
        </div>
      </div>
      <div class="updated-badge" id="updatedAt">Yükleniyor...</div>
    </div>
  </header>

  <div class="accuracy-bar" id="accuracyBar">
    <div class="accuracy-inner">
      <span class="accuracy-label">🤖 Yapay Zeka Başarı Oranı</span>
      <div class="accuracy-divider"></div>
      <span class="accuracy-detail">Sonuç: <strong id="accPct">—</strong> <span id="accCorrect" class="acc-count"></span></span>
      <span class="accuracy-detail">Tam Skor: <strong id="accExact">—</strong> <span id="accExactCount" class="acc-count"></span></span>
      <span class="accuracy-detail">Top 3 Skor: <strong id="accTop3">—</strong> <span id="accTop3Count" class="acc-count"></span></span>
    </div>
  </div>

  <div class="backtest-bar" id="backtestBar">
    <div class="backtest-inner">
      <span class="backtest-label">📊 Backtest</span>
      <span class="backtest-detail">Doğruluk: <strong id="btAcc">—</strong></span>
      <span class="backtest-detail">1. Skor: <strong id="btExact">—</strong></span>
      <span class="backtest-detail">Top 3: <strong id="btTop3">—</strong></span>
      <span class="backtest-detail">Log Loss: <strong id="btLL">—</strong></span>
      <span class="backtest-detail">Brier: <strong id="btBrier">—</strong></span>
      <span class="backtest-detail">Baseline: <strong id="btBaseline">—</strong></span>
      <span class="backtest-detail" id="btMatchCount" style="margin-left:auto;color:var(--muted)"></span>
      <span class="backtest-detail" id="btTrainCount" style="color:var(--muted)"></span>
    </div>
  </div>

  <div class="summary-bar">
    <div class="summary-inner" id="summaryBar">
      <div class="stat-pill"><span class="dot" style="background:var(--gold)"></span><strong id="statTotal">—</strong> Maç</div>
      <div class="stat-pill"><span class="dot" style="background:var(--win-green)"></span><strong id="statPlayed">—</strong> Oynanmış</div>
      <div class="stat-pill"><span class="dot" style="background:var(--blue)"></span><strong id="statRemaining">—</strong> Kalan Tahmin</div>
    </div>
  </div>

  <main>
    <div class="cal-day-nav" id="calDayNav"></div>
    <div class="cal-grid-wrap cal-collapsed" id="calGridWrap"></div>
    <div id="content"><div class="state-screen"><div class="spinner"></div><p>Tahminler yükleniyor…</p></div></div>
  </main>

  <script>
    // ── Flag CDN helper (flagcdn.com) ─────────────────────
    function getCountryCode(teamName) {
      if (!teamName) return 'un';
      const name = teamName.toLowerCase().trim();
      const countries = {
        'austria': 'at', 'belgium': 'be',
        'bosnia and herzegovina': 'ba', 'bosnia-herzegovina': 'ba',
        'croatia': 'hr', 'czech republic': 'cz', 'czechia': 'cz',
        'england': 'gb-eng', 'france': 'fr', 'germany': 'de',
        'netherlands': 'nl', 'norway': 'no', 'portugal': 'pt',
        'scotland': 'gb-sct', 'spain': 'es', 'sweden': 'se',
        'switzerland': 'ch', 'turkey': 'tr',
        'argentina': 'ar', 'brazil': 'br', 'colombia': 'co',
        'ecuador': 'ec', 'paraguay': 'py', 'uruguay': 'uy',
        'canada': 'ca', 'curacao': 'cw', 'cura\u00e7ao': 'cw',
        'haiti': 'ht', 'mexico': 'mx', 'panama': 'pa',
        'united states': 'us', 'usa': 'us',
        'algeria': 'dz', 'cape verde': 'cv', 'cape verde islands': 'cv',
        'dr congo': 'cd', 'congo dr': 'cd',
        'egypt': 'eg', 'ghana': 'gh', 'ivory coast': 'ci',
        'morocco': 'ma', 'senegal': 'sn', 'south africa': 'za',
        'tunisia': 'tn',
        'australia': 'au', 'iran': 'ir', 'iraq': 'iq',
        'japan': 'jp', 'jordan': 'jo', 'qatar': 'qa',
        'saudi arabia': 'sa', 'south korea': 'kr',
        'uzbekistan': 'uz', 'new zealand': 'nz',
      };
      return countries[name] || 'un';
    }

    function flagImg(team) {
      const code = getCountryCode(team);
      return `<img src="https://flagcdn.com/w80/${code}.png" alt="${team}" class="team-flag-img" loading="lazy" />`;
    }

    // ── Stage label map ────────────────────────────────────
    const STAGE_MAP = {
      "GROUP_STAGE":   "Grup Aşaması",
      "ROUND_OF_32":   "Son 32",
      "ROUND_OF_16":   "Son 16",
      "QUARTER_FINALS":"Çeyrek Final",
      "SEMI_FINALS":   "Yarı Final",
      "THIRD_PLACE":   "3. lük Maçı",
      "FINAL":         "Final",
    };

    function stageLabel(s) {
      return STAGE_MAP[s] || s || "Maç";
    }

    // ── Poisson PMF (memoized) ─────────────────────────────
    const _pmfCache = {};
    function poissonPmf(k, lam) {
      const key = k + ':' + lam.toFixed(4);
      if (_pmfCache[key] !== undefined) return _pmfCache[key];
      let p = Math.exp(-lam);
      for (let i = 1; i <= k; i++) p *= lam / i;
      return (_pmfCache[key] = p);
    }

    // ── "Ev Sahibi"/"Deplasman"/"Beraberlik" -> takım adı ───
    function winnerLabel(result, match) {
      return result === 'Ev Sahibi' ? match.home_team
           : result === 'Deplasman' ? match.away_team
           : 'Beraberlik';
    }

    // ── CSV parser (yedek: virgül içermeyen basit CSV için) ───────────────
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      return lines.slice(1).map(line => {
        const vals = line.split(',');
        const obj = {};
        headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim(); });
        return obj;
      });
    }

    // ── JSON → CSV yedekli veri yükleme ───────────────────────────────────
    // Önce .json dener; başarısız olursa (üretilmemişse) .csv'ye düşer.
    async function fetchData(baseName, t) {
      try {
        const r = await fetch(`data/${baseName}.json?t=${t}`);
        if (r.ok) return await r.json();
      } catch (_) { /* json yok, csv'ye düş */ }
      const r = await fetch(`data/${baseName}.csv?t=${t}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return parseCSV(await r.text());
    }

    // ── Tarih yardımcıları (timezone sabiti tek yerde) ────────
    const DateUtils = {
      TZ_TR: 'Europe/Istanbul',

      // "YYYY-MM-DD" string → Türkçe uzun tarih (Pazartesi, 11 Haziran)
      // Gün kaymasını önlemek için UTC'de yorumlanır
      format(dateStr) {
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        return d.toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', timeZone: 'UTC' });
      },

      // Maçın İstanbul takvim gününü "YYYY-MM-DD" olarak döndürür
      matchDay(match) {
        if (match.kickoff_utc) {
          const d = new Date(match.kickoff_utc);
          if (!isNaN(d)) return d.toLocaleDateString('sv-SE', { timeZone: this.TZ_TR });
        }
        return match.date?.slice(0, 10) || 'Bilinmiyor';
      },

      // "YYYY-MM-DD HH:MM UTC" → İstanbul saati
      formatUpdatedAt(utcStr) {
        const iso = utcStr.replace(' UTC', '').replace(' ', 'T') + 'Z';
        const d = new Date(iso);
        if (isNaN(d)) return utcStr;
        return d.toLocaleString('tr-TR', {
          day: 'numeric', month: 'long', year: 'numeric',
          hour: '2-digit', minute: '2-digit',
          timeZone: this.TZ_TR
        }) + ' (TR)';
      },
    };

    // Geriye dönük uyumluluk için kısa takma adlar
    const formatDate        = s    => DateUtils.format(s);
    const matchDateTR       = m    => DateUtils.matchDay(m);
    const formatUpdatedAtTR = utcs => DateUtils.formatUpdatedAt(utcs);

    // ── Render card ────────────────────────────────────────
    function renderCard(match) {
      const ph = parseFloat(match.prob_home) || 0;
      const pd = parseFloat(match.prob_draw) || 0;
      const pa = parseFloat(match.prob_away) || 0;
      const total = ph + pd + pa || 100;

      const predicted = match.predicted || '';
      const eloH = match.elo_home ? Math.round(match.elo_home) : '—';
      const eloA = match.elo_away ? Math.round(match.elo_away) : '—';

      // En olası 3 skor: tercihen predict.py'nin Dixon-Coles düzeltmeli
      // matristen ürettiği top1/2/3_score + top1/2/3_prob kolonları kullanılır
      // (dashboard'daki sıralamanın CSV'deki most_likely_score ile tutarlı
      // olması için). Bu kolonlar yoksa (eski arşiv satırları) basit Poisson
      // ile client-side hesaplanır.
      let top3;
      if (match.top1_score) {
        top3 = [1, 2, 3]
          .filter(rank => match[`top${rank}_score`])
          .map(rank => ({ s: match[`top${rank}_score`], p: parseFloat(match[`top${rank}_prob`]) / 100 }));
      } else {
        const lh = parseFloat(match.expected_home) || 1.2;
        const la = parseFloat(match.expected_away) || 1.0;
        const maxG = 9;
        top3 = [];
        for (let i = 0; i < maxG; i++) {
          for (let j = 0; j < maxG; j++) {
            const p = poissonPmf(i, lh) * poissonPmf(j, la);
            const item = { s: i + '-' + j, p };
            if (top3.length < 3) {
              top3.push(item);
              top3.sort((a, b) => b.p - a.p);
            } else if (p > top3[2].p) {
              top3[2] = item;
              top3.sort((a, b) => b.p - a.p);
            }
          }
        }
      }
      const topScoresHtml = top3.map((s, idx) => `
        <div class="top-score-item">
          <span class="top-score-val${idx === 0 ? ' first' : ''}">${s.s}</span>
          <span class="top-score-pct${idx === 0 ? ' first' : ''}">%${(s.p * 100).toFixed(1)}</span>
        </div>`).join('');

      const jokerBadge = (match.is_joker === 'True' || match.is_joker === true) && !match.played ? '<div class="joker-badge">🃏 Joker</div>' : '';

      let scoreBubbleHtml;
      let winnerText;
      if (match.played) {
        const hg = Math.round(Number(match.home_score));
        const ag = Math.round(Number(match.away_score));
        const actual = hg > ag ? 'Ev Sahibi' : hg < ag ? 'Deplasman' : 'Beraberlik';
        const hasPrediction = !!predicted;
        const correct = hasPrediction && predicted === actual;

        scoreBubbleHtml = `
            <div class="score-bubble">
              <span class="score-label">Maç Sonucu</span>
              <div class="score-display">${hg}-${ag}</div>
              ${hasPrediction ? `
              <div class="small-top-scores-label">Model Tahmini</div>
              <div class="top-scores small">${topScoresHtml}</div>` : ''}
            </div>`;

        winnerText = !hasPrediction
          ? (actual === 'Beraberlik' ? '⚪ Berabere bitti' : `⚪ ${winnerLabel(actual, match)} kazandı`)
          : correct
          ? `✅ Tahmin doğruydu (${winnerLabel(predicted, match)})`
          : `❌ Yanlış tahmin — beklenen: ${winnerLabel(predicted, match)}, gerçek: ${winnerLabel(actual, match)}`;
      } else {
        scoreBubbleHtml = `
            <div class="score-bubble">
              <span class="score-label">En Olası Skorlar</span>
              <div class="top-scores">${topScoresHtml}</div>
            </div>`;

        winnerText = `🏅 ${winnerLabel(predicted, match)} bekleniyor`;
        if (predicted === 'Beraberlik') winnerText = '🤝 Beraberlik bekleniyor';
      }

      return `
        <div class="match-card">
          ${jokerBadge}
          <div class="stage-badge">${stageLabel(match.stage)}</div>
          <div class="teams-row">
            <div class="team-block home">
              ${flagImg(match.home_team)}
              <span class="team-name">${match.home_team}</span>
              <span class="team-elo">ELO ${eloH}</span>
            </div>
${scoreBubbleHtml}
            <div class="team-block away">
              ${flagImg(match.away_team)}
              <span class="team-name">${match.away_team}</span>
              <span class="team-elo">ELO ${eloA}</span>
            </div>
          </div>
          <div class="prob-section">
            <div class="prob-bar-wrap">
              <div class="prob-seg home" style="width:${ph/total*100}%"></div>
              <div class="prob-seg draw" style="width:${pd/total*100}%"></div>
              <div class="prob-seg away" style="width:${pa/total*100}%"></div>
            </div>
            <div class="prob-labels">
              <div class="prob-item home-item">
                <span class="prob-pct home-pct">%${ph.toFixed(0)}</span>
                <span class="prob-tag">Ev</span>
              </div>
              <div class="prob-item">
                <span class="prob-pct draw-pct">%${pd.toFixed(0)}</span>
                <span class="prob-tag">Beraberlik</span>
              </div>
              <div class="prob-item away-item">
                <span class="prob-pct away-pct">%${pa.toFixed(0)}</span>
                <span class="prob-tag">Deplasman</span>
              </div>
            </div>
          </div>
          <div class="winner-ribbon">${winnerText}</div>
        </div>`;
    }

    // ── Calendar rendering ─────────────────────────────────
    // State: selectedDate, calYear, calMonth declared in load()

    // ── Main load ──────────────────────────────────────────
    async function load() {
      try {
        const t = Date.now();
        const upcoming = (await fetchData('predictions', t)).filter(m => m.home_team && m.away_team);

        // Oynanmış maçlar: matches_2026'dan gerçek skor + predictions_history'den
        // o maç için yapılmış son tahmin birleştirilir, böylece kart kaybolmadan
        // gerçek sonuç + modelin tahminini gösterebilir.
        let finished = [];
        try {
          const [allMatches, history] = await Promise.all([
            fetchData('matches_2026', t),
            fetchData('predictions_history', t),
          ]);
          {
            const histMap = {};
            history.forEach(h => {
              histMap[`${h.date}|${h.home_team}|${h.away_team}`] = h;
            });
            finished = allMatches
              .filter(m => m.status === 'FINISHED' && m.home_team && m.away_team)
              .map(m => {
                const hist = histMap[`${m.date}|${m.home_team}|${m.away_team}`] || {};
                return { ...hist, ...m, played: true };
              });
          }
        } catch(e) { /* maç sonucu/tahmin geçmişi henüz yok */ }

        // Aynı maç hem history'de hem predictions.csv'de olabilir → played=true öncelikli al
        const matchMap = new Map();
        for (const m of [...finished, ...upcoming]) {
          const key = `${m.date}|${m.home_team}|${m.away_team}`;
          if (!matchMap.has(key) || m.played) matchMap.set(key, m);
        }
        const matches = [...matchMap.values()];

        // Accuracy banner
        try {
          const accRes = await fetch('data/accuracy.json?t=' + Date.now());
          if (accRes.ok) {
            const acc = await accRes.json();
            if (acc.total > 0) {
              document.getElementById('accPct').textContent       = '%' + acc.accuracy;
              document.getElementById('accCorrect').textContent   = '(' + acc.correct + ' adet)';
              document.getElementById('accExact').textContent     = '%' + acc.exact_pct;
              document.getElementById('accExactCount').textContent = '(' + acc.exact + ' adet)';
              document.getElementById('accTop3').textContent      = '%' + acc.top3_pct;
              document.getElementById('accTop3Count').textContent  = '(' + acc.top3 + ' adet)';
              document.getElementById('accuracyBar').classList.add('loaded');
            }
          }
        } catch(e) { /* accuracy.json henüz yok, banner gizli kalır */ }
        // Backtest banner
        try {
          const btRes = await fetch('data/backtest.json?t=' + Date.now());
          if (btRes.ok) {
            const bt = await btRes.json();
            document.getElementById('btAcc').textContent      = '%' + bt.accuracy;
            document.getElementById('btExact').textContent    = '%' + bt.exact_acc;
            document.getElementById('btTop3').textContent     = bt.top3_acc !== undefined ? '%' + bt.top3_acc : '—';
            document.getElementById('btLL').textContent       = bt.log_loss;
            document.getElementById('btBrier').textContent    = bt.brier;
            document.getElementById('btBaseline').textContent = '%' + bt.baseline;
            document.getElementById('backtestBar').classList.add('loaded');
            document.getElementById('btMatchCount').textContent = 'Test: ' + bt.test_matches + ' maç';
            document.getElementById('btTrainCount').textContent   = 'Train: ' + bt.train_matches + ' maç';
          }
        } catch(e) { /* backtest.json henüz yok */ }



        // Summary bar
        document.getElementById('statTotal').textContent = matches.length;
        document.getElementById('statPlayed').textContent = finished.length;
        document.getElementById('statRemaining').textContent = upcoming.length;

        // Updated at (UTC -> TR saatine çevrilir)
        const updatedAt = upcoming[0]?.updated_at || '';
        document.getElementById('updatedAt').textContent = updatedAt
          ? `Son güncelleme: ${formatUpdatedAtTR(updatedAt)}`
          : 'Tahminler yüklendi';

        // ── Calendar state ───────────────────────────────────
        const todayStr = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Istanbul' });
        let selectedDate = null;
        let calYear, calMonth;
        let calOpen = false;

        function getMatchDates() {
          return [...new Set(matches.map(matchDateTR))].sort();
        }

        function selectDate(date) {
          selectedDate = date;
          const [y, mo] = date.split('-').map(Number);
          calYear = y; calMonth = mo - 1;
          draw();
        }

        function draw() {
          const dates = getMatchDates();
          // Geçersiz seçim varsa bugün/yakına çek
          if (!selectedDate || !dates.includes(selectedDate)) {
            selectedDate = dates.find(d => d >= todayStr) || dates[dates.length - 1] || null;
            if (selectedDate) {
              const [y, mo] = selectedDate.split('-').map(Number);
              calYear = y; calMonth = mo - 1;
            }
          }
          _renderDayNav(dates);
          _renderCalGrid(dates);
          _renderDayCards();
        }

        // _renderDayNav state: prev/next korunur, delegation bir kez kurulur
        let _dayNavPrev = null, _dayNavNext = null, _dayNavDatesRef = null;
        const _dayNavEl = document.getElementById('calDayNav');
        _dayNavEl.addEventListener('click', e => {
          const btn = e.target.closest('button, .cal-day-label');
          if (!btn) return;
          if (btn.id === 'calPrev' && _dayNavPrev) { selectDate(_dayNavPrev); return; }
          if (btn.id === 'calNext' && _dayNavNext) { selectDate(_dayNavNext); return; }
          if (btn.id === 'calDateLabel') {
            calOpen = !calOpen;
            if (calOpen && selectedDate) {
              const [y, mo] = selectedDate.split('-').map(Number);
              calYear = y; calMonth = mo - 1;
              _renderCalGrid(_dayNavDatesRef || []);
            }
            document.getElementById('calGridWrap').classList.toggle('cal-collapsed', !calOpen);
            const chev = _dayNavEl.querySelector('.cal-chevron');
            if (chev) chev.textContent = calOpen ? '▾' : '▸';
          }
        });

        function _renderDayNav(dates) {
          _dayNavDatesRef = dates;
          const idx = selectedDate ? dates.indexOf(selectedDate) : -1;
          _dayNavPrev = idx > 0 ? dates[idx - 1] : null;
          _dayNavNext = idx < dates.length - 1 ? dates[idx + 1] : null;
          const label = selectedDate ? formatDate(selectedDate).toUpperCase() : '—';
          _dayNavEl.innerHTML = `
            <button class="cal-nav-btn" id="calPrev" ${!_dayNavPrev ? 'disabled' : ''}>‹</button>
            <span class="cal-day-label" id="calDateLabel">${label}<span class="cal-chevron">${calOpen ? '▾' : '▸'}</span></span>
            <button class="cal-nav-btn" id="calNext" ${!_dayNavNext ? 'disabled' : ''}>›</button>
          `;
        }

        function _renderCalGrid(dates) {
          if (!selectedDate) return;
          const matchDateSet = new Set(dates);
          const firstDay = new Date(Date.UTC(calYear, calMonth, 1));
          const daysInMonth = new Date(Date.UTC(calYear, calMonth + 1, 0)).getUTCDate();
          const startDow = (firstDay.getUTCDay() + 6) % 7; // Pzt=0
          const DAYS = ['Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct', 'Pz'];
          const monthLabel = firstDay.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric', timeZone: 'UTC' }).toUpperCase();

          let cells = '';
          for (let i = 0; i < startDow; i++) cells += `<div class="cal-day empty"></div>`;
          for (let d = 1; d <= daysInMonth; d++) {
            const ds = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const has = matchDateSet.has(ds);
            let cls = 'cal-day' + (has ? ' has-match' : ' no-match')
              + (ds === selectedDate ? ' selected' : '')
              + (ds === todayStr ? ' today' : '')
              + (has && ds < todayStr ? ' past' : '');
            cells += `<div class="${cls}" data-date="${ds}">${d}</div>`;
          }

          document.getElementById('calGridWrap').innerHTML = `
            <div class="cal-month-header">
              <button class="cal-nav-btn" id="monthPrev">‹</button>
              <span class="cal-month-label">${monthLabel}</span>
              <button class="cal-nav-btn" id="monthNext">›</button>
            </div>
            <div class="cal-weekdays">${DAYS.map(d => `<div class="cal-wd">${d}</div>`).join('')}</div>
            <div class="cal-days">${cells}</div>
          `;

          // Event delegation: tüm takvim tıklamaları bir dinleyiciyle yakalanır
          const wrap = document.getElementById('calGridWrap');
          wrap.onclick = e => {
            const day = e.target.closest('.cal-day.has-match');
            if (day) {
              calOpen = false;
              wrap.classList.add('cal-collapsed');
              selectDate(day.dataset.date);
              return;
            }
            if (e.target.id === 'monthPrev' || e.target.closest('#monthPrev')) {
              let m = calMonth - 1, y = calYear;
              if (m < 0) { m = 11; y--; }
              calMonth = m; calYear = y;
              _renderCalGrid(dates);
            } else if (e.target.id === 'monthNext' || e.target.closest('#monthNext')) {
              let m = calMonth + 1, y = calYear;
              if (m > 11) { m = 0; y++; }
              calMonth = m; calYear = y;
              _renderCalGrid(dates);
            }
          };
        }

        function _renderDayCards() {
          if (!selectedDate) {
            document.getElementById('content').innerHTML = '<div class="state-screen"><p>Gün seçiniz.</p></div>';
            return;
          }
          const ms = matches
            .filter(m => matchDateTR(m) === selectedDate)
            .sort((a, b) => {
              const ta = a.kickoff_utc ? new Date(a.kickoff_utc).getTime() : 0;
              const tb = b.kickoff_utc ? new Date(b.kickoff_utc).getTime() : 0;
              return ta - tb;
            });
          document.getElementById('content').innerHTML = ms.length
            ? `<div class="cards-grid">${ms.map(renderCard).join('')}</div>`
            : `<div class="state-screen"><p>Bu gün için maç yok.</p></div>`;
        }


        // İlk yükleme: bugün veya ilk yaklaşan maç gününü seç
        {
          const initDates = [...new Set(matches.map(matchDateTR))].sort();
          selectedDate = initDates.find(d => d >= todayStr) || initDates[initDates.length - 1] || null;
          if (selectedDate) {
            const [y, mo] = selectedDate.split('-').map(Number);
            calYear = y; calMonth = mo - 1;
          }
        }
        draw();

      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="state-screen">
            <p>⚠️ Tahminler yüklenemedi.</p>
            <p style="font-size:11px;margin-top:4px">
              <code>data/predictions.csv</code> dosyasının mevcut olduğundan emin olun.
            </p>
          </div>`;
        console.error(err);
      }
    }

    load();
  </script>
</body>
</html>
