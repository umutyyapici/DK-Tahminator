name: Daily WC2026 Update

on:
  schedule:
    # UTC 12:00, Türkiye saatiyle 15:00
    - cron: "0 12 * * *"
  workflow_dispatch:  # Elle de tetiklenebilir

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Güncelleme çalıştır
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python src/update.py

      - name: Değişiklikleri commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches_2026.csv data/predictions.csv data/accuracy.json data/backtest.json
          # Değişiklik yoksa hata vermeden çık
          git diff --staged --quiet || git commit -m "chore: daily update $(date -u '+%Y-%m-%d')"
          git push
