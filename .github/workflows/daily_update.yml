name: Daily WC2026 Update

on:
  schedule:
    # UTC 10:00, Türkiye saatiyle 13:00
    - cron: "0 10 * * *"
  workflow_dispatch:  # Elle de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: auto_predict dosyasını kontrol et
        run: |
          echo "=== auto_predict.py satır 108-120 ==="
          sed -n '108,120p' src/auto_predict.py
          echo "=== update.py auto_predict çağrısı ==="
          grep -n "auto_predict" src/update.py

      - name: Güncelleme çalıştır
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOT_USER_ID: ${{ secrets.BOT_USER_ID }}
        run: python src/update.py

      - name: Değişiklikleri commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/matches_2026.csv data/predictions.csv data/accuracy.json data/backtest.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git commit -m "chore: daily update $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push reddedildi, rebase deneniyor (deneme $i)..."
            git pull --rebase origin main
          done
          echo "Push 5 denemeden sonra başarısız oldu."
          exit 1
